services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: demo-only
    ports: ["127.0.0.1:19760:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    volumes: ["./shop.sql:/docker-entrypoint-initdb.d/01-shop.sql:ro"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop", "-d", "shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  pricing-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: demo-only
    ports: ["127.0.0.1:19763:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    volumes: ["./pricing.sql:/docker-entrypoint-initdb.d/01-pricing.sql:ro"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shop", "-d", "shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.6
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:19761:6379"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:19762:19762"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:19762,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19762"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx512m"
    tmpfs:
      - "/var/lib/kafka/data:uid=1000,gid=1000,mode=0750"
      - "/mnt/shared/config:uid=1000,gid=1000,mode=0750"
      - "/etc/kafka/secrets:uid=1000,gid=1000,mode=0750"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 4s
      timeout: 10s
      retries: 25

  pricing-mock:
    image: wiremock/wiremock:3.13.2
    environment: [VAULT_URL, VAULT_TOKEN]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        config=$$(curl -fsS --max-time 5 -H "X-Vault-Token: $$VAULT_TOKEN" "$${VAULT_URL%/}/v1/secret/data/pricing")
        export MOCK_PRICING_CONFIG="$$config"
        exec /docker-entrypoint.sh --permitted-system-keys '^MOCK_PRICING_CONFIG$$'
    ports: ["127.0.0.1:19786:8080"]
    volumes: ["./wiremock:/home/wiremock:ro"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  vault-mock:
    image: wiremock/wiremock:3.13.2
    ports: ["127.0.0.1:19765:8080"]
    volumes: ["./vault:/home/wiremock:ro"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  loki:
    image: grafana/loki:3.6.3
    command: ["-config.file=/etc/loki/config.yaml"]
    ports: ["127.0.0.1:19764:3100"]
    volumes: ["./loki.yaml:/etc/loki/config.yaml:ro"]
    tmpfs: ["/loki:uid=10001,gid=10001,mode=0750"]
