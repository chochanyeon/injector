name: injector-poc
services:
  wiremock:
    image: wiremock/wiremock:3.13.2
    ports: ["127.0.0.1:18081:8080"]
    volumes: ["./wiremock:/home/wiremock:ro"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 3s
      timeout: 3s
      retries: 30
  catalog:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["poc.Catalog"]
    ports: ["127.0.0.1:18082:18082"]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/18082"]
      interval: 3s
      timeout: 3s
      retries: 30
  main:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports: ["127.0.0.1:18080:18080"]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/18080"]
      interval: 3s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local-demo-only
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.6
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
