<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Injector</title><link rel="stylesheet" href="/style.css"><script src="/graph.js" defer></script><script src="/app.js" defer></script></head>
<body>
<header><h1 class="brand"><a href="/">Injector</a></h1></header>
<main>
  <div class="workspace">
    <section class="card settings" aria-labelledby="setup-title">
      <h2 id="setup-title">실행 대상</h2>
      <label for="project">프로젝트 폴더</label>
      <div class="path-row">
        <input id="project" placeholder="registry.json이 있는 폴더" spellcheck="false">
        <button id="pick-project" class="secondary" disabled>폴더 선택</button>
        <button id="load" class="secondary">불러오기</button>
      </div>
      <button id="edit-registry" class="secondary registry-open" aria-controls="registry-editor" aria-haspopup="dialog" disabled>registry.json 편집</button>
      <label for="profile">프로필</label><select id="profile" disabled><option>프로젝트를 불러오세요</option></select>
      <label for="target">애플리케이션</label><select id="target" disabled></select>
      <details id="variant-picker" hidden>
        <summary>노드별 실행·대역 선택</summary>
        <fieldset id="variant-options" aria-label="노드별 variant"></fieldset>
      </details>
      <div class="note">IntelliJ 앱은 준비가 끝나면 IDE에서 <strong>Debug</strong>로 실행하세요.</div>
      <button id="prepare" class="primary" disabled>실행 환경 준비</button>
      <button id="stop" class="secondary stop">이 프로젝트의 의존성 종료</button>
    </section>
    <section class="card execution" aria-labelledby="execution-title">
      <div class="execution-heading"><h2 id="execution-title">준비 현황</h2><span id="badge" class="badge">대기 중</span></div>
      <details class="plan-disclosure" open>
        <summary>실행 순서</summary>
        <p id="summary" class="hint">프로필과 앱을 선택하면 실행 순서를 확인할 수 있습니다.</p>
        <ol id="plan" class="plan"></ol>
      </details>
      <div id="result" role="status" aria-live="polite">실행 환경을 준비할 수 있습니다.</div>
      <details><summary>진행 기록</summary><pre id="events">아직 실행한 작업이 없습니다.</pre></details>
    </section>
  </div>
  <details id="dependency-graph" class="card dependency-graph" open>
    <summary class="graph-heading">의존성 그래프</summary>
    <div class="graph-filter">
      <label for="graph-scope">표시할 앱</label>
      <select id="graph-scope" disabled><option value="">전체 앱</option></select>
    </div>
    <p id="graph-status" class="hint" role="status">프로젝트를 불러오세요.</p>
    <div id="graph-frame" class="graph-frame" hidden>
      <div id="graph-viewport" class="graph-viewport" tabindex="0" aria-label="앱에서 의존성으로 이어지는 그래프">
        <div id="graph-columns" class="graph-columns"></div>
      </div>
      <canvas id="graph-edges" aria-hidden="true"></canvas>
    </div>
    <section id="graph-inspector" class="graph-inspector" aria-label="선택한 노드의 연결" aria-live="polite" hidden></section>
    <details id="graph-relations" class="graph-relations" hidden>
      <summary>직접 의존성 목록</summary>
      <ul id="graph-direct"></ul>
    </details>
  </details>
  <dialog id="registry-editor" class="card registry-editor" aria-labelledby="registry-title">
    <div class="registry-heading">
      <h2 id="registry-title">registry.json</h2>
      <div class="registry-window-actions">
        <button id="registry-fold" class="secondary" title="초안을 유지하고 편집기 접기">접기</button>
        <button id="registry-close" class="secondary">닫기</button>
      </div>
    </div>
    <div id="registry-file-picker" class="registry-file-picker" hidden>
      <label for="registry-file">설정 파일</label>
      <select id="registry-file"></select>
    </div>
    <div class="registry-location">
      <p id="registry-path" class="registry-path"></p>
      <button id="registry-pick-project" class="secondary" disabled>폴더 변경</button>
    </div>
    <textarea id="registry-text" aria-label="JSON 설정 편집" aria-describedby="registry-path registry-status"
              rows="22" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" disabled></textarea>
    <div class="registry-actions">
      <button id="registry-reload" class="secondary" disabled>파일 다시 읽기</button>
      <button id="registry-validate" class="secondary" disabled>검증</button>
      <button id="registry-save" class="primary" disabled>저장</button>
    </div>
    <p id="registry-status" class="registry-status" role="status" aria-live="polite"></p>
  </dialog>
  <footer>종료는 Injector가 만든 자원에만 적용됩니다.</footer>
</main></body></html>
